services:
  backend:
    image: minhnhat810/mern-backend:1.0
    network_mode: bridge
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: ${MONGODB_URI:?Please set MONGODB_URI}
    restart: unless-stopped

  frontend:
    image: minhnhat810/mern-frontend:1.0
    ports:
      - "4173:4173"
    restart: unless-stopped
